name: Build ImmortalWrt for Tenda BE12 Pro

on:
  workflow_dispatch:
    inputs:
      openclash_branch:
        description: 'OpenClash branch'
        required: false
        default: 'master'
      ssh:
        description: 'SSH debug (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: 25.12-dev-wifi7
  CONFIG_FILE: config/defconfig-delta
  DIY_SH: diy.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/az
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libelf-dev libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
            qemu-utils ccache
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"

      - name: Clone source
        run: |
          git clone -b ${{ env.REPO_BRANCH }} --single-branch --depth=1 \
            ${{ env.REPO_URL }} openwrt

      - name: Add third-party feeds
        working-directory: openwrt
        run: |
          cat >> feeds.conf.default << 'EOF'
          src-git kenzo https://github.com/kenzok8/openwrt-packages
          src-git small https://github.com/kenzok8/small
          EOF

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone OpenClash
        working-directory: openwrt
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.openclash_branch || 'master' }} \
            https://github.com/vernesong/OpenClash.git /tmp/openclash
          rm -rf package/luci-app-openclash
          cp -r /tmp/openclash/luci-app-openclash package/
          grep -m1 'PKG_VERSION:=' package/luci-app-openclash/Makefile

      # iStore：kenzo feed 里本来就有 luci-app-store / luci-lib-taskd /
      # luci-lib-xterm / taskd 四个同名包。feeds install 之后如果再从 istore
      # 仓库拷一份到 package/，就会出现同名包重复定义，kconfig 符号被冲掉
      # （表现为 .config 里完全没有 CONFIG_PACKAGE_luci-app-store）。
      # 这里先删掉 feed 里的同名包，再用 istore 官方版（带 USE_APK 支持）。
      - name: Prepare iStore packages (dedupe)
        working-directory: openwrt
        run: |
          git clone --depth=1 https://github.com/istoreos/istore.git /tmp/istore
          for d in luci-app-store luci-lib-taskd luci-lib-xterm taskd; do
            rm -rf "package/feeds/kenzo/$d"
          done
          rm -rf package/luci-app-store package/luci-lib-taskd \
                 package/luci-lib-xterm package/taskd
          cp -r /tmp/istore/luci/luci-app-store \
                /tmp/istore/luci/luci-lib-taskd \
                /tmp/istore/luci/luci-lib-xterm \
                /tmp/istore/luci/taskd \
                package/
          echo "--- istore pkgs now in package/ ---"
          ls -d package/luci-app-store package/luci-lib-taskd \
                package/luci-lib-xterm package/taskd
          echo "--- any duplicates left in feeds? ---"
          find package/feeds -maxdepth 2 -name 'luci-app-store' \
            -o -maxdepth 2 -name 'luci-lib-taskd' \
            -o -maxdepth 2 -name 'luci-lib-xterm' \
            -o -maxdepth 2 -name 'taskd' | sed 's/^/DUP: /' || true

      - name: Merge config
        working-directory: openwrt
        run: |
          base="defconfig/low-mem-512m/mt7987-mt7992-be7200.config"
          test -f "$base" || { echo "ERROR: base config not found: $base"; exit 1; }
          sed -e '/routerich_be7200/d' \
              -e '/CONFIG_PACKAGE_luci-app-upnp/d' \
              -e '/CONFIG_PACKAGE_miniupnpd-nftables/d' \
              -e '/CONFIG_PACKAGE_luci-i18n-upnp-zh-cn/d' \
              -e '/CONFIG_PACKAGE_luci-app-eqos-mtk/d' \
              "$base" > .config.base
          cat .config.base ${{ github.workspace }}/${{ env.CONFIG_FILE }} > .config
          rm -f .config.base

      - name: Set default LAN IP
        working-directory: openwrt
        run: |
          sed -i 's/192\.168\.1\.1/192.168.3.1/g' \
            package/base-files/files/bin/config_generate

      - name: Generate config
        working-directory: openwrt
        run: |
          make defconfig

      # 若 luci-app-store 仍未选中，精确打印每个 kconfig 条件符号的值
      - name: Ensure luci-app-store selected
        working-directory: openwrt
        run: |
          if grep -q '^CONFIG_PACKAGE_luci-app-store=y$' .config; then
            echo "luci-app-store 已选中 OK"
            exit 0
          fi
          echo "::error::luci-app-store 未被选中，以下为诊断信息"
          echo "=== 条件符号精确值 ==="
          for s in PACKAGE_tar PACKAGE_TAR_XZ PACKAGE_xz-utils PACKAGE_libc \
                   PACKAGE_curl PACKAGE_libuci-lua PACKAGE_luci-lib-taskd \
                   PACKAGE_luci-lua-runtime PACKAGE_mount-utils \
                   LIBCURL_LDAP USE_GLIBC; do
            v=$(grep -E "^(CONFIG_${s}=|# CONFIG_${s} is not set)" .config | head -1)
            echo "  ${s} = ${v:-<未出现于 .config>}"
          done
          echo "=== kconfig 块 ==="
          grep -n -A18 'config PACKAGE_luci-app-store$' tmp/.config-package.in | head -22
          echo "=== 是否存在多个同名包 ==="
          find package -maxdepth 3 -name 'luci-app-store' 2>/dev/null || true
          exit 1

      - name: Verify config kept required packages
        working-directory: openwrt
        run: |
          fail=0
          for p in luci-app-openclash luci-app-store taskd luci-lib-taskd \
                   luci-lib-xterm mihomo v2ray-geoip; do
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "CONFIG OK   $p"
            else
              echo "CONFIG MISS $p"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Compile firmware
        working-directory: openwrt
        run: |
          echo "=== Start compiling ==="
          make -j$(nproc) || make -j1 V=s
          echo "=== Compilation done ==="

      - name: Verify built manifest
        working-directory: openwrt
        run: |
          M=$(ls bin/targets/mediatek/filogic/*.manifest 2>/dev/null | head -1)
          test -n "$M" || { echo "ERROR: no manifest produced"; exit 1; }
          echo "manifest: $M"
          fail=0
          for p in luci-app-openclash luci-app-store mihomo v2ray-geoip \
                   taskd luci-lib-taskd luci-theme-argon luci-i18n-base-zh-cn \
                   kmod-mt7992 kmod-mt_wifi7; do
            if grep -q "^${p} " "$M"; then
              echo "OK   $p"
            else
              echo "MISS $p"
              fail=1
            fi
          done
          echo "--- total packages: $(wc -l < "$M") ---"
          [ $fail -eq 0 ] || echo "::error::required packages missing"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-be12-pro-final-${{ github.run_number }}
          path: openwrt/bin/targets/mediatek/filogic/*
          retention-days: 30
          if-no-files-found: warn

      - name: SSH debug
        if: github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
